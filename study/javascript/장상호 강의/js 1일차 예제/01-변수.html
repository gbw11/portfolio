<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<script>
		// var, let, const 차이
		// consts밖에 안쓴다.
		// var : 재할당, 재선언 가능
		// let : 재할당 가능
		// const : 재할당, 재선언 불가능
		// const쓰는 이유? 재할당이 불가능 하기 때문에 변수 추적에 용이
	
		// 변순 선언 규칙 : 카멜 케이스
		// 단어와 단어를 연결 할 때 연결되는 첫 문자를 대문자로
	
		let firstNumber = 10
		firstNumber = 20

		console.log(firstNumber)

    const secondNumber  = 10
    // secondNumber = 20  재할당 불가능
    console.log(secondNumber)

    a = 10
    b = 20

    a = 30
    b = 40
    console.log(a)
    console.log(b)
    
	</script>
</body>
</html>
