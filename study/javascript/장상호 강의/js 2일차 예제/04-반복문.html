<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
  // 1. while, 0부터 5까지 출력
    // let i = 0
    // while(i<=5) {
    //     console.log(i)
    //   i++
    // }

  // 2. for, 0부터 5까지 출력
    for(let i=0; i<6 ; i++){
      console.log(i)
    }


  // 3. for...in, 3-1. a b 출력, 3-2. apple banana 출력
  const object = {
    a: 'apple',
    b: 'banana'
  }
  for(const str in object){
    console.log(str)
  }

  for(const key in object){
    console.log(object[key])
  }


  // 4. for...of, 4-1. 1 2 3 4 출력, 4-2. a p p l e 출력
  const numbers = [1, 2, 3, 4]
  for(const num of numbers){
    console.log(num)
  }

  const myStr = 'apple'
  for(const str of myStr){
    console.log(str)
  }


  //5. for...in 과 for...of 의 차이, 5-1. 0, 1, 2 출력, 5-2. a, b, c 출력
  const arr = ['a', 'b', 'c']
  for(const tmp in arr){
    console.log(tmp)
  }

  for(const tmp of arr){
    console.log(tmp)
  }
  </script>
</body>

</html>
