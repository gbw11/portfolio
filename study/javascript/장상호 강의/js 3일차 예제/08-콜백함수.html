<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    
    // 콜백함수란? : 함수의 인자로 들어가는 함수
   
    // 1
    // forEach함수 안에 인자로 function(num){}  ==> 콜백 함수 
    const numbers1 = [1, 2, 3]
    numbers1.forEach(function(num){
      console.log(num**2)
    })


    // 1번 방식을 화살표 함수로( 1) function키워드 삭제, 2) 인자 1개면 소괄호 삭제)
    // 딘잠 : 콜백함수 재사용 X
    numbers1.forEach(num=>console.log(num**2))

    // 2 콜백함수
    const numbers2 = [4, 5, 6]
    const callBackFunc1 = function(num){
      console.log(num**2)
    }
    // 함수 호출
    numbers2.forEach(callBackFunc1) // 콜백함수는 callBackFunc1

    // 2번 방식을 화살표 함수로
    // 2번 방식은 언제 쓸까?
    const callBackFunc2 = num => console.log(num**2)
    numbers2.forEach(callBackFunc2)

    // 장점 : 재사용 가능

    // 결론 : 함수의 인자로 들어가는 함수 : 콜백함수
    // 결론 : 화살표 함수(콜백 함수는 화살표 함수로!!)

  </script>
</body>

</html>
