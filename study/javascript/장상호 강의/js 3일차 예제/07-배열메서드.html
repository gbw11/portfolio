<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    const names = ['Alice', 'Bella', 'Cathy']

    // pop : 마지막 요소를 제거하고 반환
    console.log(names.pop())
    console.log(names)

    // push : 마지막에 요소를 추가
    names.push('Daniel')
    console.log(names)

    // shift : 맨 앞에 요소를 제거하고 반환
    console.log(names.shift())
    console.log(names)

    // unshift
    console.log(names.unshift('Apple'))
    console.log(names)

    // splice (시작 인덱스, 삭제할 개수, 추가할 items)
    names.splice(1, 1, "love")
    console.log(names)
    
  </script>
</body>

</html>
