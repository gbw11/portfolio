<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investor Dashboard - Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <nav class="sticky top-0 z-50 w-full bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                    <i data-lucide="trending-up" class="text-white"></i>
                </div>
                <span class="text-xl font-black text-slate-800 tracking-tight">INVEST<span class="text-blue-600">HUB</span></span>
            </div>
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-2xl border border-slate-200">
                <a href="profile.html" class="px-4 sm:px-6 py-2 rounded-xl text-sm font-bold bg-white text-blue-600 shadow-sm border border-slate-200">기본 정보</a>
                <a href="portfolio.html" class="px-4 sm:px-6 py-2 rounded-xl text-sm font-bold text-slate-500 hover:text-slate-800 transition-all">포트폴리오</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 md:p-10">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            <div class="md:col-span-4 space-y-6">
                <section class="bg-white border border-slate-200 p-8 rounded-[2.5rem] flex flex-col items-center shadow-sm">
                    <div class="relative">
                        <div class="profile-avatar rounded-full overflow-hidden border-4 border-white shadow-2xl shadow-blue-100">
                            <img src="https://images.unsplash.com/photo-1599566150163-29194dcaad36?q=80&w=200&h=200&auto=format&fit=crop" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="w-full mt-10">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2 block">자기소개</label>
                        <textarea class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 text-sm outline-none resize-none h-32 transition-all" placeholder="소개글">안녕하세요! 꾸준한 투자를 실천합니다.</textarea>
                        <button class="w-full mt-3 bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl text-sm font-bold shadow-lg shadow-blue-100 transition-all">정보 업데이트</button>
                    </div>
                </section>
            </div>

            <div class="md:col-span-8 space-y-6">
                <div class="bg-white border border-slate-200 p-8 rounded-[2.5rem] shadow-sm">
                    <h3 class="text-lg font-bold mb-6 text-blue-600">투자 스타일 (택1)</h3>
                    <div class="flex flex-wrap gap-3">
                        <button class="style-btn active">공격투자형</button>
                        <button class="style-btn">안정추구형</button>
                        <button class="style-btn">위험중립형</button>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div class="bg-white border border-slate-200 p-6 rounded-[2rem] shadow-sm">
                        <h4 class="text-sm font-bold mb-4">상품 선호도 (중복)</h4>
                        <div class="space-y-2">
                            <label class="checkbox-item"><input type="checkbox" checked> <span>국내주식</span></label>
                            <label class="checkbox-item"><input type="checkbox" checked> <span>펀드/ETF</span></label>
                        </div>
                    </div>
                    <div class="bg-white border border-slate-200 p-6 rounded-[2rem] shadow-sm text-center">
                        <h4 class="text-sm font-bold mb-4">관심 종목</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xs font-bold text-slate-600 block mb-2">반도체</span>
                                <input type="checkbox" checked class="accent-blue-600">
                            </div>
                            <div class="p-3 bg-slate-50 rounded-xl border border-slate-100">
                                <span class="text-xs font-bold text-slate-600 block mb-2">ESG</span>
                                <input type="checkbox" class="accent-blue-600">
                            </div>
                        </div>
                    </div>
                </div>
                <section class="bg-white border border-slate-200 p-8 rounded-[2.5rem] shadow-sm">
                    <h3 class="text-xl font-bold mb-8">기본 정보 설정</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400">회원 번호</label>
                            <div class="input-readonly"><span>M-2026-0082</span><i data-lucide="lock" size="14"></i></div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-400">아이디</label>
                            <div class="input-readonly"><span>ssafy_user</span><i data-lucide="lock" size="14"></i></div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">이메일 주소</label>
                            <input type="email" value="user@ssafy.com" class="input-editable">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">닉네임</label>
                            <input type="text" value="투자의귀재" class="input-editable">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">나이</label>
                            <input type="number" value="28" class="input-editable">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-slate-600">총 자산 (₩)</label>
                            <input type="number" value="30000000" class="input-editable">
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script>
        lucide.createIcons();
        const styleBtns = document.querySelectorAll('.style-btn');
        styleBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                styleBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
